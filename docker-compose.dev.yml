services:
  postgres-dev:
    image: postgres:15-alpine
    container_name: t-erp-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: t_erp_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    networks:
      - t-erp-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d t_erp_dev"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_dev_data:

networks:
  t-erp-dev-network:
